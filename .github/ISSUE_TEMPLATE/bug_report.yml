name: Bug report
description: Something looks wrong or doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to see, and what did you see instead?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The page link from your browser. It includes the selected date and station.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone, Chrome on Windows
