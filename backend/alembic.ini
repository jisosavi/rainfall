[alembic]
script_location = migrations
prepend_sys_path = .
# DATABASE_URL is read from app settings in migrations/env.py, not from here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
# stdout: Railway marks stderr lines as errors, and the migrations run at every web start (start.sh).
# A failing migration still shows as an error: its traceback goes to stderr.
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
